name: Hub
options:
  bundleIdPrefix: ru.voevodin
  deploymentTarget:
    iOS: "15.0"
targets:
  Hub:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.voevodin.hub
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Hub/Info.plist
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Hub/Info.plist
      properties:
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Вход в Hub по Face ID или паролю телефона
        NSCameraUsageDescription: Фото для вложений в записи Hub
        NSPhotoLibraryUsageDescription: Выбор файлов и фото для вложений в записи Hub
        WKAppBoundDomains:
          - 153-76-162-117.sslip.io
        ITSAppUsesNonExemptEncryption: false
